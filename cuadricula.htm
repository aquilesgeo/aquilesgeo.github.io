<html>
<head>
	<title>Cuadricula 21x31</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="text-align:center;background:#202020;margin:0px">
	<canvas id="canvasId" width="420" height="620"></canvas>
<script>
	var img = new Image();
	
	img.onload = ()=>{
		var ctx = document.getElementById('canvasId').getContext('2d');
		ctx.drawImage(img, 0, 0);
		ctx.beginPath();
		ctx.lineWidth = 0.5;
		for(let i=20;i<620;i+=20){
			ctx.moveTo(0, i);
			ctx.lineTo(420, i);
		}
		for(let i=20;i<420;i+=20){
			ctx.moveTo(i, 0);
			ctx.lineTo(i, 620);
		}
		ctx.stroke();
	}

	function loadImage(){
		img.src = 'cuadricula.jpg';
	}
	
	loadImage();
	
</script>

</body>


</html>

<html>
	<head>
		<title>Workout timer</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			td, th {
				padding:10px;
				border:1px solid #404040;
			}
			.screenBlock{
				max-width:1000;
				margin:auto;
			}
			.buttonStart{
				background:#002040;
				color:#ffffff;
				cursor:pointer;
				display: inline-block;
				padding:5px 10px;
			}
		</style>
	</head>
	<body style="color:#ffffff;background:#202020;font:20px Tahoma">
		<div id="configDiv" style="display:block" class="screenBlock">			
			<table style="width:100%;border-collapse:collapse">
				<tr><th>SEGUNDOS</th><th>VECES</th><th>PAUSA</th><th>&nbsp;</th></tr>
				<tr><td>2</td><td>100</td><td>5</td><td><span class="buttonStart" onclick="setupTimer(2, 100, 5)">timer</span></td></tr>
				<tr><td>2</td><td>100</td><td>10</td><td><span class="buttonStart" onclick="setupTimer(2, 100, 10)">timer</span></td></tr>
				<tr><td>3</td><td>100</td><td>5</td><td><span class="buttonStart" onclick="setupTimer(3, 100, 5)">timer</span></td></tr>
				<tr><td>3</td><td>100</td><td>10</td><td><span class="buttonStart" onclick="setupTimer(3, 100, 10)">timer</span></td></tr>
			</table>
			<span class="buttonStart" onclick="startTimer()">iniciar</span><br>
			<hr>
			Tiempo <span id="idtime"></span><br>
			Veces <span id="idtics"></span><br>
			Pausa cada <span id="idpause"></span><br>
		</div>
		<div id="runnerDiv" class="screenBlock" style="display:none">
			<div id="textBoard" width="100%" height="90%" style="text-align:center;font:bold 100px Verdana"></div>
			<span id="idStopButton" class="buttonStart" onclick="stopTimer()">pausar</span>
			<span id="idStartButton" style="display:none" class="buttonStart" onclick="startTimer()">iniciar</span>
			<span class="buttonStart" onclick="returnConfig()">regresar</span>
			
		</div>
		<audio id="idTick" src="mouse-click-3-381775.mp3"></audio>
		<script>
			const tickSound = document.getElementById("idTick");
			var configTime;
			var configTics;
			var configPauseTick;
			var configPauseTime = 2000;
			var ticks;
			var status = 0;
			var running = false;
			var nextTime = 0;
			var textBoard = document.getElementById('textBoard');
		
			function playTick() {
				tickSound.currentTime = 0;   // rewind so rapid ticks are allowed
				tickSound.play();
			}
		
			function setupTimer(s, t, p){
				configTime = s;
				configTics = t;
				configPauseTick = p;
				document.getElementById('idtime').innerHTML = s;
				document.getElementById('idtics').innerHTML = t;
				document.getElementById('idpause').innerHTML = p;
			}
			
			function startTimer(){
				if (configTime==undefined){
					return;
				}
				status = 0;
				running = true;
				nextTime = 0;
				ticks = 0;
				requestAnimationFrame(appLoop);
				document.getElementById('configDiv').style.display='none';
				document.getElementById('runnerDiv').style.display='';
				document.getElementById('idStartButton').style.display='none';
				document.getElementById('idStopButton').style.display='';
			}
			function returnConfig(){
				running = false;
				document.getElementById('configDiv').style.display='';
				document.getElementById('runnerDiv').style.display='none';
			}
			function appLoop(timestamp){				
				if (!running){
					return;
				}				
				if (nextTime==0){
					nextTime = timestamp + 1000;
					textBoard.innerHTML = "3";
				}else{
					if (nextTime<timestamp){
						switch(Number(status)){
							case 0:
								textBoard.innerHTML = "3";
								nextTime += 1000;
								status = 1;								
								break;
							case 1:
								textBoard.innerHTML = "2";
								nextTime += 1000;
								status = 2;								
								break;
							case 2:
								textBoard.innerHTML = "1";
								nextTime += configTime*1000;
								status = 3;
								playTick();
								ticks++;
								break;
							case 3:
								textBoard.innerHTML = String(ticks+1);
								ticks++;
								if (ticks>configTics){
									textBoard.innerHTML = "Fin";									
								}else{
									playTick();
								}
								nextTime += configTime*1000;
								if ((ticks) % configPauseTick==0){									
									nextTime += configTime*1000 + configPauseTime;
								}
								
								break;
						}
					}
				}
				if (textBoard.innerHTML!="Fin"){
					requestAnimationFrame(appLoop);
				}
			}
			function stopTimer(){
				document.getElementById('idStartButton').style.display='';
				document.getElementById('idStopButton').style.display='none';
				running = false;
			}
			
			setupTimer(3, 100, 5);
		</script>
		
	</body>

</html>
